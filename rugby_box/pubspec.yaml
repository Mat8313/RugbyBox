name: rugby_box
description: "Boîtier d'affichage des statistiques rugby (Top 14, Champions Cup, RC Toulon)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # Réponses ESPN enregistrées, servies en mode « données fictives ».
  assets:
    - assets/mock/espn/
